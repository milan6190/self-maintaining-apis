name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: Run the example end to end
        run: ./examples/petstore/demo.sh

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record a baseline for the example
        run: |
          python -m pip install --quiet .
          cd examples/petstore && apimend snapshot
      - name: Run the action against the drifted example
        id: drift
        uses: ./
        continue-on-error: true
        env:
          PETSTORE_VERSION: v2
        with:
          working-directory: examples/petstore
          heal: "true"
      - name: The action must report breaking drift
        run: |
          test "${{ steps.drift.outcome }}" = "failure"
          test "${{ steps.drift.outputs.breaking }}" -gt 0
