openapi: 3.0.3
info: { title: Acme Orders API, version: 2.4.0 }
servers:
  - url: https://api.acme.com/v2
paths:
  /orders:
    get:
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /orders/{id}/cancel:
    post:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Cancelled } }
components:
  schemas:
    Order:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [open, paid, cancelled] }
        total: { type: number }
